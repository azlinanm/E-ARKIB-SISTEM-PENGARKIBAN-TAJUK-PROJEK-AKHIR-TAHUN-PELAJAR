<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Preview</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <button id="downloadBtn">Download PDF</button>

    <script>
        // Read URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const jsonData = decodeURIComponent(urlParams.get("data"));
        const booking = JSON.parse(jsonData);

        document.getElementById("downloadBtn").addEventListener("click", () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(16);
            doc.text("Student Booking Details", 20, 20);

            doc.setFontSize(12);
            doc.text(`Name: ${booking.studentName}`, 20, 40);
            doc.text(`ID: ${booking.studentID}`, 20, 50);
            doc.text(`Title: ${booking.title}`, 20, 60);
            doc.text(`Abstract: ${booking.abstractText}`, 20, 70);
            doc.text(`Tools: ${booking.tools}`, 20, 80);
            doc.text(`Comment: ${booking.comment}`, 20, 90);
            doc.text(`Status: ${booking.status}`, 20, 100);

            doc.save("Booking.pdf");
        });
    </script>
</body>
</html>
