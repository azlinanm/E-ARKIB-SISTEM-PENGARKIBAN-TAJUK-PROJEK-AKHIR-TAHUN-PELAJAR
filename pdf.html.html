<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Generate PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<script>
    function getQueryParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }

    var jsonData = getQueryParam("data");
    if (!jsonData) {
        alert("No data received from Unity.");
    } else {
        var booking = JSON.parse(jsonData);
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        let y = 10;
        doc.setFontSize(12);

        doc.text("Nama Pelajar: " + booking.studentName, 10, y); y += 10;
        doc.text("ID Pelajar: " + booking.studentID, 10, y); y += 10;
        doc.text("Tajuk: " + booking.title, 10, y); y += 10;

        doc.text("Abstrak:", 10, y);
        let sp = doc.splitTextToSize(booking.abstractText, 180);
        doc.text(sp, 10, y + 10);
        y += (sp.length * 6) + 10;

        doc.text("Peralatan: " + booking.tools, 10, y); y += 10;
        doc.text("Ulasan: " + booking.comment, 10, y); y += 10;
        doc.text("Status: " + booking.status, 10, y);

        doc.save("Tempahan_Tajuk.pdf");

        // Close page after download
        setTimeout(() => window.close(), 1000);
    }
</script>

</body>
</html>
